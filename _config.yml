theme: jekyll-theme-primer

# Force Jekyll to completely ignore heavy source code, test suites, and automation scripts
exclude:
  - cmake/
  - CMakeLists.txt
  - include/
  - scripts/
  - tests/
  - DISCLAIMER
  - LICENSE
  - NOTICE
  - "**/CMakeLists.txt"

# Ensure Jekyll specifically looks for files inside your documentation directories
include:
  - docs/
  - benchmarks/INDEX.md
  - examples/INDEX.md
  - PORTAL.md
  - README.md
